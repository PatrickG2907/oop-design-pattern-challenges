5">- Reuses the existing instance.</text><text x="710.27" y="369.012" fill="#000" font-size="13" textLength="240.583">- Provides metadata without loading.</text><text x="710.27" y="384.145" fill="#000" font-size="13"> </text><text x="710.27" y="399.278" fill="#000" font-size="13" textLength="111.319">Protection Proxy:</text><text x="710.27" y="414.411" fill="#000" font-size="13" textLength="220.353">- Checks UserRole before loading.</text><text x="710.27" y="429.543" fill="#000" font-size="13" textLength="211.358">- Rejects unauthorized requests.</text><text x="710.27" y="444.676" fill="#000" font-size="13"> </text><text x="710.27" y="459.809" fill="#000" font-size="13" textLength="104.019">Content access:</text><text x="710.27" y="474.942" fill="#000" font-size="13" textLength="121.202">1. authorizeRead()</text><text x="710.27" y="490.075" fill="#000" font-size="13" textLength="118.936">2. ensureLoaded()</text><text x="710.27" y="505.208" fill="#000" font-size="13" textLength="179.086">3. realBook_->getContent()</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="119"><path d="M1147.89,561.947 L1147.89,677.877 A0,0 0 0 0 1147.89,677.877 L1437.053,677.877 A0,0 0 0 0 1437.053,677.877 L1437.053,571.947 L1427.053,561.947 L1297.33,561.947 L1293.33,527.527 L1289.33,561.947 L1147.89,561.947 A0,0 0 0 0 1147.89,561.947" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1427.053,561.947 L1427.053,571.947 L1437.053,571.947 L1427.053,561.947" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1153.89" y="579.014" fill="#000" font-size="13" textLength="81.586">RealSubject:</text><text x="1153.89" y="594.147" fill="#000" font-size="13" textLength="221.654">- Stores title, author, and content.</text><text x="1153.89" y="609.279" fill="#000" font-size="13" textLength="259.086">- Initializes content during construction.</text><text x="1153.89" y="624.412" fill="#000" font-size="13" textLength="268.163">- Returns non